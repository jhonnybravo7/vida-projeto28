<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f6f7f4"><title>Seu primeiro acesso — Vida Nova</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/vida-v21.css?v=26"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script><style>body{background:#f6f7f4} .login{min-height:100dvh;padding:24px}.loginbox{width:100%;max-width:440px}label{display:block}#message{min-height:24px;margin-top:16px} .show-pass{display:flex;align-items:center;gap:8px;margin:12px 0 20px;font-size:14px}.show-pass input{width:auto}button:disabled{opacity:.6}h1{font-size:32px}.loginbox p{line-height:1.5}</style></head>
