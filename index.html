<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Vida Nova — Projeto 28: educação para emagrecimento, acompanhamento e constância.">
  <title>Vida Nova — Projeto 28</title>
  <link rel="manifest" href="/manifest.json?v=9">
  <link rel="icon" href="/icon.svg?v=9">
  <link rel="stylesheet" href="/styles.css?v=9">
  <link rel="stylesheet" href="/v3.css?v=9">
  <link rel="stylesheet" href="/experience-v4.css?v=9">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script>
    window.__VIDA_BOOT_STARTED=Date.now();
    window.addEventListener('error',e=>{window.__VIDA_BOOT_ERROR=String(e.message||'Erro de carregamento')});
    window.addEventListener('unhandledrejection',e=>{window.__VIDA_BOOT_ERROR=String(e.reason?.message||e.reason||'Erro de inicialização')});
  </script>
</head>
<body>
  <div id="globalLoading" class="global-loading hidden"><div class="spinner"></div><b>Carregando...</b></div>
  <div id="login" class="login">
    <div class="loginbox">
      <span class="badge">VIDA NOVA</span>
      <h1>Projeto 28</h1>
      <p>Seu conteúdo, acompanhamento e constância em um só lugar.</p>
      <div class="field"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="email" placeholder="voce@email.com"></div>
      <div class="field"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Sua senha"></div>
      <button class="btn full" onclick="login()">ENTRAR</button>
      <button class="text-button full" onclick="forgotPassword()">PRIMEIRO ACESSO / ESQUECI MINHA SENHA</button>
      <p id="authMsg" class="notice auth-msg"></p>
      <p class="login-help">Comprou agora? Digite o mesmo e-mail usado no checkout e toque em <b>Primeiro acesso</b> para definir sua senha.</p>
    </div>
  </div>
  <div id="root" class="app hidden">
    <header class="top"><div><div class="logo">VIDA NOVA</div><div class="brand-sub">PROJETO 28</div></div><button class="avatar" onclick="go('profile')" aria-label="Abrir perfil">V</button></header>
    <main id="view"></main>
    <nav class="nav" aria-label="Navegação principal">
      <button data-go="home" onclick="go('home')"><span class="ico">⌂</span>INÍCIO</button>
      <button data-go="learn" onclick="go('learn')"><span class="ico">▤</span>APRENDER</button>
      <button data-go="track" onclick="go('track')"><span class="ico">✓</span>ACOMPANHAR</button>
      <button data-go="progress" onclick="go('progress')"><span class="ico">↗</span>PROGRESSO</button>
      <button data-go="gym" onclick="go('gym')"><span class="ico">🏆</span>GYM RATS</button>
    </nav>
  </div>
  <div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalcard"><div class="modalbar"></div><div id="modalContent"></div></div></div>
  <div id="toast" class="toast"></div>
  <script>window.VIDA_LESSONS={};</script>
  <script src="/week1.js?v=9"></script><script src="/week2.js?v=9"></script><script src="/week3.js?v=9"></script><script src="/week4.js?v=9"></script><script src="/meta.js?v=9"></script><script src="/content-v3.js?v=9"></script><script src="/guides-full.js?v=9"></script><script src="/app-v3.js?v=9"></script><script src="/ui-patch.js?v=9"></script><script src="/signup-patch.js?v=9"></script><script src="/experience-v5.js?v=9"></script>
  <script>
    setTimeout(()=>{
      const login=document.getElementById('login'),root=document.getElementById('root');
      if(login?.classList.contains('hidden')&&root?.classList.contains('hidden')){
        login.classList.remove('hidden');
        const m=document.getElementById('authMsg');
        if(m)m.textContent='Não foi possível concluir a inicialização. Atualize a página e tente novamente.';
      }
    },5000);
  </script>
</body>
</html>
